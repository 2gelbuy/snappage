<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <title>SnapPage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="3"/>
      <circle cx="12" cy="12" r="3.5"/>
      <path d="M3 8h18" opacity="0.3"/>
    </svg>
    <span class="header-title">SnapPage</span>
    <span class="header-badge">FREE</span>
  </header>

  <main class="main">
    <!-- Mode Tabs -->
    <div class="mode-tabs" role="tablist" aria-label="Capture mode">
      <button class="mode-tab active" role="tab" aria-selected="true" data-mode="full-page">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="1" width="12" height="14" rx="1.5"/><path d="M5 4h6M5 7h4M5 10h5" opacity="0.5"/></svg>
        Full Page
      </button>
      <button class="mode-tab" role="tab" aria-selected="false" data-mode="visible-area">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M5 8h6" opacity="0.5"/></svg>
        Visible Area
      </button>
      <button class="mode-tab" role="tab" aria-selected="false" data-mode="selection" title="Select area">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 5V3a1 1 0 011-1h2M11 2h2a1 1 0 011 1v2M14 11v2a1 1 0 01-1 1h-2M5 14H3a1 1 0 01-1-1v-2"/></svg>
        Select
      </button>
    </div>

    <!-- Options -->
    <div class="options-grid">
      <div class="option-card">
        <span class="option-label">Format</span>
        <select id="format" class="option-select" aria-label="Image format">
          <option value="png" selected>PNG (lossless)</option>
          <option value="jpeg">JPG (smaller)</option>
          <option value="pdf">PDF</option>
        </select>
      </div>
      <div class="option-card">
        <span class="option-label">Quality</span>
        <select id="quality" class="option-select" aria-label="Image quality">
          <option value="100" selected>100% Best</option>
          <option value="90">90% High</option>
          <option value="80">80% Good</option>
          <option value="70">70% Fair</option>
        </select>
      </div>
    </div>

    <!-- Capture Button -->
    <button id="capture" class="capture-btn" aria-label="Capture screenshot">
      <svg class="btn-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <rect x="3" y="3" width="14" height="14" rx="2.5"/>
        <circle cx="10" cy="10" r="3"/>
      </svg>
      <span class="btn-text">Capture Screenshot</span>
      <span class="btn-loading-text">Capturing...</span>
      <span class="spinner" aria-hidden="true"></span>
    </button>

    <!-- Progress -->
    <div id="progress" class="progress-container" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-bar-track">
        <div id="progress-fill" class="progress-bar-fill"></div>
      </div>
      <div class="progress-info">
        <span id="progress-text" class="progress-text">Starting capture...</span>
        <span id="progress-pct" class="progress-pct">0%</span>
      </div>
    </div>

    <!-- Status -->
    <div id="status" class="status" role="status" aria-live="polite"></div>

    <!-- Quick Actions (shown after capture) -->
    <div id="quick-actions" class="quick-actions" style="display:none">
      <button class="quick-action" id="action-copy" title="Copy to clipboard">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="8" height="8" rx="1"/><path d="M3 11V3a1 1 0 011-1h8"/></svg>
        Copy
      </button>
      <button class="quick-action" id="action-open" title="Open in new tab">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 2h5v5M14 2L7 9"/><path d="M12 9v4a1 1 0 01-1 1H3a1 1 0 01-1-1V5a1 1 0 011-1h4"/></svg>
        Open
      </button>
      <button class="quick-action" id="action-again" title="Capture again">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8a6 6 0 0111.5-2.5M14 8a6 6 0 01-11.5 2.5"/><path d="M14 2v3.5h-3.5M2 14v-3.5h3.5"/></svg>
        Again
      </button>
    </div>

    <!-- Tip -->
    <div id="tip" class="tip-banner">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3M8 10.5v.5"/></svg>
      <span>Navigate to any webpage, then click <strong>Capture</strong> or press <strong>Alt+Shift+S</strong></span>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-left">
      <span class="shortcut-badge">Alt+Shift+S</span>
    </div>
    <div class="footer-right">
      <span class="version-tag">v0.2.0</span>
    </div>
  </footer>

  <script type="module" src="main.ts"></script>
</body>
</html>
